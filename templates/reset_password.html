{% extends "base_simple.html" %}
{% block title %}Nueva contraseña{% endblock %}
{% block subtitle %}Recuperar acceso{% endblock %}

{% block content %}
<section class="card narrow">
    <h1>Nueva contraseña</h1>
    <p class="sub">Usuario: <strong>{{ username }}</strong></p>
    <form method="POST" class="grid">
        <label>Nueva contraseña<input type="password" name="new_password" required minlength="6" autofocus autocomplete="new-password"></label>
        <label>Repite la contraseña<input type="password" name="confirm_password" required minlength="6" autocomplete="new-password"></label>
        <button class="btn" type="submit">Guardar contraseña</button>
    </form>
</section>
{% endblock %}

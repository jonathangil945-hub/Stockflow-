{% extends "base_simple.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block subtitle %}Mi cuenta{% endblock %}

{% block content %}
<section class="card narrow">
    <h1>Cambiar contraseña</h1>
    <p class="sub">Usuario: <strong>{{ current_username }}</strong></p>
    <form method="POST" class="grid">
        <label>Contraseña actual<input type="password" name="current_password" required autocomplete="current-password"></label>
        <label>Nueva contraseña<input type="password" name="new_password" required minlength="6" autocomplete="new-password"></label>
        <label>Repite la nueva contraseña<input type="password" name="confirm_password" required minlength="6" autocomplete="new-password"></label>
        <button class="btn" type="submit">Guardar</button>
    </form>
</section>
{% endblock %}
